glossary:
  title: "Glossário"
  hint: "Toque num termo para ver o que ele quer dizer."  # checked (SI)
  terms:
    ndvi:
      term: "NDVI"
      definition: "Índice de verde calculado com luz vermelha e infravermelho próximo. Valores baixos não dizem se o chão está descoberto ou sob palha."
    evapotranspiration:
      term: "Evapotranspiração"
      definition: "Água que sai do talhão como vapor, pelo solo e pelas plantas."
    soil_moisture_anomaly:
      term: "Anomalia de umidade do solo"
      definition: "O quanto o solo está mais úmido ou mais seco que o normal para a época. Valores de satélite cobrem cerca dos 5 cm de cima, em dezenas de quilômetros."
    frost_risk:
      term: "Risco de geada"
      definition: "Chance de frio que prejudica a cultura. Aqui é um alerta regional pela temperatura mínima, não previsão para o talhão."
    water_balance:
      term: "Balanço hídrico"
      definition: "Chuva e água guardada que entram, menos enxurrada, drenagem, evaporação e uso pelas plantas."
    site_season:
      term: "Local-safra de ensaio"  # checked (SI)
      definition: "Um local de ensaio numa safra. Os 10 locais-safra vêm de 3 locais, então não são independentes."  # checked (SI)
    zarc:
      term: "Zarc"  # checked (SI)
      definition: "Zoneamento Agrícola de Risco Climático do Ministério da Agricultura (MAPA). Define as janelas de semeadura ligadas a seguro e crédito rural."  # checked (SI)
    dekad:
      term: "Decêndio"  # checked (SI)
      definition: "Período de cerca de dez dias. Cada mês tem três: dias 1 a 10, 11 a 20 e 21 ao fim do mês."  # checked (SI)
    bag:
      term: "Saca"  # checked (SI)
      definition: "60 kg de grão, a unidade usada no Brasil para preço e produtividade."  # checked (SI)

