# Written with an SI tool (Claude, Anthropic) for NASA Space Apps 2026. See AI_USE.md.
# Aftercrop screen copy, Portuguese (Brazil). Written with an AI assistant (AI_USE.md).
#
# Same keys and placeholders as copy_en.yaml (plan SA-D59). tests/test_copy.py checks both.
# The printed agronomist sheet uses the sheet block of this file (sheet M8).
#
# House style: no em dash, no en dash and no semicolon in any string, and none of the
# words of criterion M7.5.
# Every string translates copy_en.yaml. Translations of wording the plan fixes in English
# are not marked: review them as translations.
# "drafted, review" marks the same keys as in copy_en.yaml, whose meaning the plan does not fix.
# "plan PT" names the plan section whose Portuguese wording is used as written.
# Field labels carry their article, because the sentence is "Precisamos saber {field}."

