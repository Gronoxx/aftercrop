# Written with an SI tool (Claude, Anthropic) for NASA Space Apps 2026. See AI_USE.md.
# Aftercrop screen copy, English. Written with an AI assistant (AI_USE.md).
#
# Every text the page, How we know, the glossary and the agronomist sheet show (plan SA-D59).
# copy_pt.yaml has the same keys. tests/test_copy.py checks both files.
# Written before any result (criterion M0.5). English is the default language.
#
# House style: no em dash, no en dash and no semicolon in any string, and none of the
# words of criterion M7.5.
# Placeholders in braces, like {field}, {Option} or {N}, are filled by the page. They are
# identical in both languages. {N} and {n} are different placeholders.
# A comment with a section number names the plan section that fixes the wording.
# "drafted, review" marks text the plan does not fix. The participant reviews it.

meta:
  lang: "en"
  language_name: "English"
  switch_to: "Português"                     # language button, shows the other language  # checked (SI)
  switch_aria: "Ver esta página em português" # read in the other language  # checked (SI)
  decimal_mark: "."                          # checked (SI)
  thousands_mark: ","                        # checked (SI)
  percent: "{v}%"                            # a number in percent, as in gain, a and b of L3  # checked (SI)

# Ids of STATES in site/js/decision.mjs. Words of section 13.7.
states:
  keep: "Keep what you do"
  try_strip: "Try it on a strip here"
  tied: "Tied"
  not_enough: "Not enough evidence"
  removed: "Out here"                        # from "{Option} is out here" (7.15)  # checked (SI)

# Main sentence, by the result code of decision.mjs (section 7.15).
answers:
  invalid_field: "Not enough evidence. We need your {field}."
  pays_without_gain: "Try it on a strip here. {Option} pays on your numbers without any soybean gain. Use paired, repeated strips."
  few_trials: "Not enough evidence. On your numbers, {Option} needs {G} bags/ha more soybean next season, and we have only {n} trial site-seasons. The rule asks for at least 5."
  counts_try: "Try it on a strip here. On your numbers, {Option} needs {G} bags/ha more soybean next season. Trials reached that in {N} of {n} site-seasons. Use paired, repeated strips."
  counts_keep: "Keep what you do. On your numbers, {Option} needs {G} bags/ha more soybean next season. Trials reached that in only {N} of {n} site-seasons."
  counts_tied: "Tied. On your numbers, {Option} needs {G} bags/ha more soybean next season. Trials reached that in {N} of {n} site-seasons, which does not settle it."
  removed: "{Option} is out here: {reason}."
  window_outside: "Not enough evidence. Your corn sowing date is outside the Zarc window, so this page will not say keep what you do."
  need_sowing_date: "Not enough evidence. We need your sowing date."
  out_of_range: "Not enough evidence. These numbers give no usable break-even for {Option}."  # checked (SI)
  evidence_unusable: "Not enough evidence. The trial counts for {Option} could not be read, so this page gives no verdict."  # checked (SI)
  window_unknown: "Not enough evidence. The Zarc window for this field could not be read, so this page gives no verdict."  # checked (SI)
  method_missing: "Not enough evidence. The establishment method of each {Option} site-season could not be read, so this page gives no verdict."  # S2 without the establishment method (protocol 11)  # checked (SI)
  both_removed: "Keep what you do. Corn with grass and wheat on part are both out here, for the reasons below."  # checked (SI)
  other_option: "For {Option}, the answer is: {state}."  # second clause of the main sentence (7.15)  # checked (SI)

# MESSAGES of site/js/decision.mjs, same keys and words.
messages:
  needSowingDate: "Not enough evidence. We need your sowing date."
  windowOutside: "Not enough evidence. Your corn sowing date is outside the Zarc window, so this page will not say keep what you do."

# FIELD_LABELS of site/js/decision.mjs: the words for {field}, same keys and words.
fields:
  p_soy: "soybean price"
  p_corn: "corn price"
  p_wheat: "net wheat price"
  Y_corn: "typical corn yield"
  Y_wheat: "typical wheat yield"
  c_corn: "corn cost"
  c_wheat: "wheat cost"
  c_grass: "grass cost"
  q: "wheat quality factor"
  sowing_date: "sowing date"

# Flags of windowContext in decision.mjs (sections 7.15 and 12.3).
flags:
  window_warning: "Satellite estimate: the first green cycle persisted beyond the corn Zarc window in {k} of {n} seasons."  # protocol 11, SA-D62  # checked (SI)
  date_in_charge: "Your date is in charge on this field."
  check_window_with_bank: "Check your sowing date against the Zarc window with your bank."
  date_invalid: "This sowing date could not be read. Type it again with day, month and year."  # checked (SI)
  zarc_window_unknown: "The Zarc window for this field could not be read. Check it with your bank."  # checked (SI)

# Reading of the HLS window (section 12.3). There is no "inside".
window:
  at_the_edge: "Satellite estimate: the first green cycle persisted beyond the corn Zarc window in {k} of {n} seasons. That is fewer than the rule needs, so the reading stays at the edge."  # checked (SI). k counts outside seasons (rehearsal)
  # SA-D64: without a soil report the window end is the latest of every class and cycle group.
  outside_any_class: "Satellite estimate: the first green cycle persisted beyond the corn Zarc window for any soil class in {k} of {n} seasons."  # 7.15  # checked (SI)
  at_the_edge_any_class: "Satellite estimate: the first green cycle persisted beyond the corn Zarc window for any soil class in {k} of {n} seasons. That is fewer than the rule needs, so the reading stays at the edge."  # checked (SI). k counts outside seasons (rehearsal)
  any_class_note: "No soil report: the window end used is the latest of every Zarc soil class and cycle group of the municipality."  # checked (SI)
  no_window: "No corn Zarc window was found for this municipality, so the satellite has nothing to be compared with."  # checked (SI)
  # SA-D72.3 and SA-D72.2: counts of the past, never a sowing date and never "inside".
  ended_before: "Satellite estimate: the first green cycle ended before the corn Zarc window closed in {k} of {n} seasons."  # checked (SI)
  ended_before_any_class: "Satellite estimate: the first green cycle ended before the corn Zarc window closed, for the soil class and cycle whose window closes earliest, in {k} of {n} seasons."  # SA-D84  # checked (SI)
  risk_at_exit:
    line: "Satellite estimate: the first green cycle ended in a ten-day period the Zarc rates at {r}% risk for {crop} in {k} of {n} seasons."  # checked (SI)
    line_any_class: "Satellite estimate: the first green cycle ended in a ten-day period the Zarc rates at {rmin} to {rmax}% risk for {crop}, depending on the soil class, in {k} of {n} seasons."  # checked (SI)
    line_any_class_one: "Satellite estimate: the first green cycle ended in a ten-day period the Zarc rates at {r}% risk for {crop} for any zoned soil class in {k} of {n} seasons."  # checked (SI)
    outside: "Satellite estimate: the first green cycle ended in a ten-day period outside the Zarc zoning for {crop} in {k} of {n} seasons."  # checked (SI)
    outside_any_class: "Satellite estimate: the first green cycle ended in a ten-day period outside the Zarc zoning for {crop} for every soil class in {k} of {n} seasons."  # checked (SI)
    # SA-D90: one sentence per column when the seasons fall in more than one risk group.
    groups: "Satellite estimate: the first green cycle ended in a ten-day period whose Zarc risk for {crop} was {parts}."  # drafted, review
    groups_any_class: "Satellite estimate: the first green cycle ended in a ten-day period whose Zarc risk for {crop}, depending on the soil class, was {parts}."  # drafted, review
    part_one: "{r}% in {k} of {n} seasons"  # drafted, review
    part_range: "{rmin} to {rmax}% in {k} of {n} seasons"  # drafted, review
    parts_last: "{a} and {b}"  # drafted, review
    part_outside: "outside the zoning in {k} of {n} seasons"  # drafted, review
    part_outside_any_class: "outside the zoning for every soil class in {k} of {n} seasons"  # drafted, review
  same_as_S1: "Same satellite reading as {name}."  # SA-D90, S2 when its satellite numbers equal those of S1  # drafted, review
  class_selector:
    label: "Soil class from your soil report"  # checked (SI)
    unknown: "unknown"  # checked (SI)
    hint: "The Zarc soil class (AD1 to AD6) comes only from a soil report, never from the global soil map."  # checked (SI)
  soil_class_unknown: "The Zarc window cannot be matched to this soil yet. The Zarc soil class (AD1 to AD6) is not derived from the global soil map, so check the window with your bank."  # soil_class_unknown of M5  # checked (SI)
  states:
    outside: "outside"
    at_the_edge: "at the edge"
    no_data: "no data"
    to_confirm: "to confirm"

# S2 trials by establishment method (protocol 11, SA-D68 row S2). Method ids of the decision base.
s2_methods:
  title: "Corn with grass trials, by establishment method"  # checked (SI)
  limit: "Two establishment methods and seeding rates, one grass species sown on the corn sowing day."  # checked (SI)
  line: "{method} ({sites}): {n} site-seasons"  # checked (SI)
  line_counted: "{method} ({sites}): trials reached that in {N} of {n} site-seasons"  # checked (SI)
  names:
    in_row_or_alternate_rows_2kg: "grass in the corn row or in alternate rows, 2 kg/ha"  # checked (SI)
    broadcast_8_12kg: "grass broadcast, 8 to 12 kg/ha"  # checked (SI)

# Text templates for uncertainty (sections 7.13, 12.2 and 12.4).
risk:
  simulated: "Simulated with the climate of 1984 to 2025: {N} of {M} seasons (about {K} in 10)"
  power: "POWER reanalysis, regional cell, 1984 to 2025: {N} of {M} years (about {K} in 10)"
  regional: "{N} of {M} years, regional"
  trials: "Trials reached that in {N} of {n} site-seasons"
  date_bar: "Last clean look {d1}, next clean look {d2}"
  inside_model: "Inside the model only"
  climate_line: "Climate: Simulated with the climate of 1984 to 2025: {N} of {M} seasons (about {K} in 10)"
  parameters: "Parameters: same direction in about {K} in 10 model variations. This is not a chance of success."
  trials_line: "Trials: {label}"
  icons_alt: "Simulated: {K} of 10 icons filled"  # checked (SI)

# Seals of section 7.14. Ids are the evidence_class values of the ledger (8.6).
seals:
  names:
    seen_by_satellite: "Seen by satellite"
    estimated_from_satellite: "Estimated from satellite"
    reanalysis: "Reanalysis"
    simulated: "Simulated"
    measured_in_trials: "Measured in trials"
    derived_from_trials: "Derived from trials"
    official_rule: "Official rule"
    published_climatology: "Published climatology"
    your_numbers: "Your numbers"
    unknown: "Unknown"
  help:
    seen_by_satellite: "Reflectance and NDVI only."  # checked (SI)
    estimated_from_satellite: "Dates, green cycles and IMERG rain, estimated from satellite."  # checked (SI)
    reanalysis: "NASA POWER climate. Stretches from GEOS-IT are marked provisional."  # checked (SI)
    simulated: "Output of the crop model."  # checked (SI)
    measured_in_trials: "A number published by a field trial."  # checked (SI)
    derived_from_trials: "Our calculation on published trial means."  # checked (SI)
    official_rule: "A Portaria or the Zarc."  # checked (SI)
    published_climatology: "Published climatology, like GloREDa, with no specific year."  # checked (SI)
