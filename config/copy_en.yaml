    soil_moisture_anomaly:
      term: "Soil moisture anomaly"
      definition: "How much wetter or drier the soil is than usual for the season. Satellite values cover about the top 5 cm over tens of kilometers."
    frost_risk:
      term: "Frost risk"
      definition: "Chance of cold that harms the crop. Here it is a regional alert from minimum temperature, not a field forecast."
    water_balance:
      term: "Water balance"
      definition: "Rain and stored water in, minus runoff, drainage, evaporation and plant use."
    site_season:
      term: "Trial site-season"  # checked (SI)
      definition: "One trial site in one season. The 10 site-seasons come from 3 sites, so they are not independent."  # checked (SI)
    zarc:
      term: "Zarc"  # checked (SI)
      definition: "Official agricultural climate risk zoning of the Brazilian Ministry of Agriculture (MAPA). It sets the sowing windows tied to insurance and rural credit."  # checked (SI)
    dekad:
      term: "Ten-day period"  # checked (SI)
      definition: "About ten days. Each month has three: days 1 to 10, 11 to 20 and 21 to the end of the month."  # checked (SI)
    bag:
      term: "Bag"  # checked (SI)
      definition: "60 kg of grain, the unit used in Brazil for prices and yields."  # checked (SI)

