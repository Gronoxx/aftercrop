    title: "Limits"
    # Declared limits of PROTOCOL.md section 14, word for word. Item 7 (p <= 0.10) is left
    # out, because M7.5 forbids p on the page. [DECIDE]
    declared:
      - "The test is not blind. The observed values were read in the audit."
      - "Exploratory. Contrast and thresholds come from the same 10 values."
      - "10 site-seasons from 3 sites, not independent."
      - "The engine sees only water. Wheat may dry the profile and corn may leave early. Water alone may give a null or opposite signal."
      - "What is tested is not what goes to the screen. T1 uses plots, published dates and maintained systems. The field uses estimated dates, SoilGrids and a single switch."
      - "Trials sit above 750 g/kg clay under no-till. A different soil triggers a warning."
      - "Ablation measures dependence, not accuracy."
      - "T1 tests only S3 against S1. S2, L2, the erosivity class and the 0.7 and 0.3 cut-offs have no external test."
      - "No real farmer will have used the tool by the submission."
    not_used_title: "What we did not use and why"  # 7.10
    not_used:                                # from 5.5, 11.9, 13.8 and 14.10
      - "Municipal crop statistics (IBGE PAM): the unit is the municipality, and they do not record the previous crop."  # checked (SI)
      - "Subjective crop-stage reports (Deral): their error cannot be measured, so they are not field truth."  # checked (SI)
      - "Ground truth for satellite dates: there is none for these fields. N1 measures repeatability, not accuracy."  # checked (SI)
      - "A sequence generator: it would produce sequences with no trial, and the rule that travels is no trial, no verdict."  # checked (SI)
      - "Barley and cowpea: trial losses came from disease or an undetermined cause. Sorghum: no regional effect confirmed. Perennials: the model does not simulate them."  # checked (SI)
      - "Machine learning and language models in the product: there is no independent target to learn from."  # checked (SI)
      - "Same-year yield and price pairs: the simulated anomaly was not shown to follow the real one."  # checked (SI)

