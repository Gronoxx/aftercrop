  provisional: "provisional"  # checked (SI)

# Label of the crop-sequence model check (sections 7.15 and 11.6). Ids are those of
# pipeline/bench/label.py, which reads its texts from here once this file exists.
labels:
  not_completed:
    title: "Not completed"
    body: "The test bench did not finish before the freeze. No result is implied."
  model_not_validated_here:
    title: "Model not validated here"
    body: "The model did not pass its check against the field trials. Results from the crop sequence stay on How we know. This page uses satellite history, trials, rules and your numbers."
  direction_not_validated:
    title: "Direction not validated"
    body: "The model passed its reference check but did not reproduce the difference between wheat and corn as the previous crop. That means not shown, not disproved. Water at sowing is simulated, not independently checked."
  direction_matched_mechanism_not_shown:
    title: "Direction matched, mechanism not shown"
    body: "The model followed the trials, but it did not pass the wrong-year test or the run without carried-over water, or one of them did not finish. We cannot say water explains it."
  direction_supported_exploratory:
    title: "Direction supported in 10 trial site-seasons (exploratory, not blind)"
    body: "The model followed the trials and passed both controls. This holds for wheat on part, in this region only. It says nothing about how much you would gain."

